[server]
headless = true
maxUploadSize = 10
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#165B4C"
backgroundColor = "#F5F4F0"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#15191E"
linkColor = "#165B4C"
borderColor = "#D9D5CB"
showWidgetBorder = true
baseRadius = "0.625rem"
buttonRadius = "0.625rem"
font = "Inter"
baseFontSize = 15
chartCategoricalColors = ["#1B7F6B", "#3F5BD0", "#E0932B", "#D2553F", "#7A5AA6", "#2A9DB5", "#8A8F98"]
dataframeBorderColor = "#E6E3DC"
dataframeHeaderBackgroundColor = "#F3F1EC"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
style = "normal"
weight = "100 900"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-ext-wght-normal.woff2"
style = "normal"
weight = "100 900"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[theme.sidebar]
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F1EFE9"
borderColor = "#E6E3DC"
showBorder = true
